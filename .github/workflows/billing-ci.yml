name: billing-ci

on:
  push:
    branches: [main]
    paths: ['services/Oficina.Billing/**', 'services/Oficina.Billing.Tests/**', 'global.json', '.github/workflows/billing-ci.yml']
  pull_request:
    branches: [main]
    paths: ['services/Oficina.Billing/**', 'services/Oficina.Billing.Tests/**', 'global.json', '.github/workflows/billing-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Billing tests
        run: dotnet test services/Oficina.Billing.Tests --configuration Release --logger trx --results-directory test-results/billing
      - name: Build Billing container
        run: docker build -f services/Oficina.Billing/Dockerfile -t oficina-billing:${{ github.sha }} .
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-test-results
          path: test-results/**/*.trx
          if-no-files-found: ignore
